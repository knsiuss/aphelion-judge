[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "aphelion-judge"
version = "0.1.0"
description = "First-principles RAG groundedness and hallucination verifier (3.8B Micro-CoT)"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "torch>=2.1.0",
    "transformers>=4.44.0",
    "huggingface_hub>=0.25.0",
]

[project.optional-dependencies]
gguf = ["llama-cpp-python>=0.3.2"]
